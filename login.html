<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-box">

    <h1>Login</h1>

    <input type="text"
           id="loginUser"
           placeholder="Enter Username">

    <input type="password"
           id="loginPass"
           placeholder="Enter Password">

    <button onclick="login()">
        Login
    </button>

    <p>
        Don't have an account?
        <a href="signup.html">Signup</a>
    </p>

</div>

<script src="script.js"></script>

</body>

</html>
