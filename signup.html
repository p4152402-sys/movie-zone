<!DOCTYPE html>
<html>

<head>
    <title>Signup</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

    <h1>Signup</h1>

    <input type="text"
           id="signupUser"
           placeholder="Username">

    <input type="password"
           id="signupPass"
           placeholder="Password">

    <button onclick="signup()">
        Create Account
    </button>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script src="script.js"></script>

</body>

</html>
